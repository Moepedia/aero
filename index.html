<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--surface:#fff;--text:#1c1b19;--muted:#6f6b64;--accent:#c4562b;--user:#efe9df;--border:#e3dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171614;--surface:#211f1c;--text:#ece9e2;--muted:#9a958b;--accent:#e07a4f;--user:#2c2924;--border:#34312b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171614;--surface:#211f1c;--text:#ece9e2;--muted:#9a958b;--accent:#e07a4f;--user:#2c2924;--border:#34312b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:600}
header h1 span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.msg{padding:11px 15px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{background:var(--user);align-self:flex-end}
.msg.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.err{color:#b3261e;align-self:center;font-size:14px}
.hint{color:var(--muted);text-align:center;margin:auto;font-size:15px}
#bar{display:flex;gap:8px;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;max-height:140px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5;cursor:default}
#attach{font-size:20px;line-height:1;padding:0 14px;border-radius:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 12px 10px}
.msg pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:10px 12px;overflow-x:auto;white-space:pre-wrap;font:13px/1.45 ui-monospace,Consolas,monospace;position:relative}
.msg .copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px}
</style>
</head>
<body>
<header>
  <h1><span>◆</span> Aero Chat</h1>
  <button class="ghost" id="clear" type="button">Percakapan baru</button>
</header>

<main id="log" aria-live="polite">
  <p class="hint" id="hint">Tanya apa saja. Enter untuk kirim, Shift+Enter untuk baris baru.</p>
</main>

<div id="bar">
  <button class="ghost" id="attach" type="button" title="Lampirkan file">+</button>
  <input type="file" id="file" multiple hidden>
  <textarea id="in" rows="1" placeholder="Tulis pesan…"></textarea>
  <button id="send" type="button">Kirim</button>
</div>

<footer>Memori persisten via Upstash Redis. Tanpa API key di klien.</footer>

<script>
(function(){
  var log=document.getElementById('log'),
      input=document.getElementById('in'),
      send=document.getElementById('send'),
      hint=document.getElementById('hint');

  var busy=false, ctrl=null, pending=[];
  var fileIn=document.getElementById('file');

  function newSessionId(){
    return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
  }

  function getIdentity(){
    var uid=localStorage.getItem('aero_user_id');
    if(!uid){
      uid='user_'+Math.random().toString(36).slice(2,10);
      localStorage.setItem('aero_user_id',uid);
    }
    var sid=localStorage.getItem('aero_session_id');
    if(!sid){
      sid=newSessionId();
      localStorage.setItem('aero_session_id',sid);
    }
    return {userId:uid, sessionId:sid};
  }

  function add(cls,text){
    if(hint){hint.remove();hint=null;}
    var d=document.createElement('div');
    d.className='msg '+cls;
    d.textContent=text;
    log.appendChild(d);
    log.scrollTop=log.scrollHeight;
    return d;
  }

  function render(el, text){
    el.textContent='';
    if(!text) return;

    // PERBAIKAN: Gunakan backtick utuh, bukan baris baru
    var parts = String(text).split('```');

    for(var i=0;i<parts.length;i++){
      var part = parts[i];

      if(i%2===0){
        if(part) el.appendChild(document.createTextNode(part));
        continue;
      }

      var newlineIndex = part.indexOf('\n');
      var code;
      if(newlineIndex === -1) code = part;
      else code = part.slice(newlineIndex + 1);

      if(code.endsWith('\n')) code = code.slice(0, -1);

      var pre=document.createElement('pre');
      var btn=document.createElement('button');
      btn.type='button';
      btn.className='ghost copy';
      btn.textContent='Salin';

      btn.addEventListener('click', function(c){
        return function(){
          // Notifikasi: ubah teks tombol saat tersalin
          navigator.clipboard.writeText(c).then(
            function(){
              btn.textContent='✅ Tersalin!';
              btn.style.color='var(--accent)';
              setTimeout(function(){
                btn.textContent='Salin';
                btn.style.color='var(--muted)';
              }, 2000);
            },
            function(){
              btn.textContent='❌ Gagal';
              setTimeout(function(){btn.textContent='Salin';}, 2000);
            }
          );
        };
      }(code));

      pre.appendChild(btn);
      pre.appendChild(document.createTextNode(code));
      el.appendChild(pre);
    }
  }

  function appendMessage(role, content){
    var cls = (role === 'user') ? 'user' : 'ai';
    var box=document.createElement('div');
    box.className='msg ' + cls;
    log.appendChild(box);
    render(box, content || '');
    log.scrollTop=log.scrollHeight;
  }

  async function loadHistory(){
    var ids = getIdentity();
    try{
      var resp = await fetch(`/api/history?userId=${encodeURIComponent(ids.userId)}&sessionId=${encodeURIComponent(ids.sessionId)}`);
      if(!resp.ok) return;
      var data = await resp.json();
      var messages = data && data.messages ? data.messages : [];

      if(messages.length){
        if(hint){hint.remove(); hint=null;}
        log.innerHTML='';
        for(var i=0;i<messages.length;i++){
          var m = messages[i];
          if(!m || !m.role || !m.content) continue;
          appendMessage(m.role, m.content);
        }
      }
    }catch(e){
      // silent fail
    }
  }

  async function submit(){
    var text=input.value.trim();
    if((!text && !pending.length) || busy) return;

    input.value='';
    input.style.height='auto';

    busy=true; send.disabled=true;

    var fullMessage=text;
    var names=[];
    for(var i=0;i<pending.length;i++){
      names.push(pending[i].name);
      fullMessage += "\n\n[Lampiran: " + pending[i].name + "]\n" + pending[i].text;
    }
    if(!fullMessage.trim()) fullMessage='(lampiran kosong)';

    appendMessage('user', text + (names.length ? ((text?'\n':'')+'📎 '+names.join(', ')) : ''));

    pending=[];
    var out=document.createElement('div');
    out.className='msg ai';
    out.textContent='Berpikir…';
    log.appendChild(out);
    log.scrollTop=log.scrollHeight;

    var ids=getIdentity();
    var controller=new AbortController();
    ctrl=controller;

    try{
      var resp=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
          userId: ids.userId,
          sessionId: ids.sessionId,
          message: fullMessage
        })
      });

      if(!resp.ok){
        var errText=await resp.text();
        throw {message:'HTTP '+resp.status+' — '+errText.slice(0,200)};
      }

      var data=await resp.json();
      var reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!reply) throw {message:'Balasan kosong dari upstream'};

      render(out, reply);
    }catch(e){
      if(e && e.name==='AbortError'){
        out.remove();
      }else{
        out.remove();
        add('err','Gagal: '+((e && e.message) || 'kesalahan tidak diketahui'));
      }
    }

    busy=false; send.disabled=false; input.focus();
  }

  document.getElementById('attach').addEventListener('click',function(){fileIn.click();});

  fileIn.addEventListener('change', async function(){
    var files=Array.prototype.slice.call(fileIn.files);
    fileIn.value='';

    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(f.size>5*1024*1024){
        add('err',f.name+' terlalu besar (maks 5 MB).');
        continue;
      }

      if(f.name.toLowerCase().endsWith('.zip')){
        add('user','📦 Membaca arsip: '+f.name+'...');
        try{
          var zip = await JSZip.loadAsync(f);
          var combinedText = "";
          var fileCount = 0;

          for (var filename in zip.files) {
            var entry = zip.files[filename];
            if (entry.dir) continue;

            if (filename.match(/\.(txt|md|csv|json|log|xml|html|css|js|ts|py|c|cpp|h|cs|java|rs|lua|yml|yaml|ini|cfg|sh|bat|asm|s)$/i)) {
              var content = await entry.async('string');
              combinedText += "\n\n[File dalam zip: " + filename + "]\n" + content;
              fileCount++;
              if (combinedText.length > 300000) {
                combinedText += "\n\n[... Arsip terpotong karena terlalu besar ...]";
                break;
              }
            }
          }

          if(fileCount>0){
            pending.push({name: f.name+' (arsip)', text: combinedText});
            add('user','✅ Berhasil mengekstrak '+fileCount+' file teks dari '+f.name);
          }else{
            add('err','Tidak ada file teks yang ditemukan di dalam '+f.name);
          }
        }catch(e){
          add('err','Gagal membaca zip: '+e.message);
        }
      }else{
        try{
          var buffer = await f.arrayBuffer();
          var bytes = new Uint8Array(buffer);

          var isBinary=false;
          for(var j=0;j<Math.min(bytes.length,100);j++){
            if(bytes[j]===0){ isBinary=true; break; }
          }

          if(isBinary){
            var strings=[];
            var currentStr="";
            for(var k=0;k<bytes.length;k++){
              var c=bytes[k];
              if(c>=32 && c<=126){
                currentStr += String.fromCharCode(c);
              }else{
                if(currentStr.length>=4) strings.push(currentStr);
                currentStr="";
              }
            }
            if(currentStr.length>=4) strings.push(currentStr);

            var extracted = strings.join("\n");
            if(extracted.length>0){
              pending.push({
                name: f.name+' (biner)',
                text: "[Strings yang diekstrak dari file biner "+f.name+"]\n"+extracted
              });
              add('user','🔍 Mengekstrak strings dari biner: '+f.name);
            }else{
              add('err','Tidak ada teks yang bisa diekstrak dari '+f.name);
            }
          }else{
            var textContent = new TextDecoder("utf-8").decode(bytes);
            pending.push({name:f.name, text:textContent});
            add('user','📎 '+f.name+' (siap dikirim)');
          }
        }catch(e){
          add('err','Gagal membaca '+f.name+': '+e.message);
        }
      }
    }
  });

  send.addEventListener('click',submit);

  input.addEventListener('keydown',function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      submit();
    }
  });

  input.addEventListener('input',function(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,140)+'px';
  });

  document.getElementById('clear').addEventListener('click', function(){
    if(ctrl) ctrl.abort();

    busy=false; send.disabled=false; pending=[];
    localStorage.removeItem('aero_session_id');
    localStorage.setItem('aero_session_id', newSessionId());

    log.innerHTML='';
    hint=document.createElement('p');
    hint.className='hint';
    hint.textContent='Percakapan baru dimulai.';
    log.appendChild(hint);

    input.focus();
  });

  loadHistory();
})();
</script>
</body>
</html>
