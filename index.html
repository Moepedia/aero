<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Chat</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--surface:#fff;--text:#1c1b19;--muted:#6f6b64;--accent:#c4562b;--user:#efe9df;--border:#e3dfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#171614;--surface:#211f1c;--text:#ece9e2;--muted:#9a958b;--accent:#e07a4f;--user:#2c2924;--border:#34312b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171614;--surface:#211f1c;--text:#ece9e2;--muted:#9a958b;--accent:#e07a4f;--user:#2c2924;--border:#34312b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
header h1{font-size:17px;margin:0;font-weight:600}
header h1 span{color:var(--accent)}
button{font:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px}
#log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;max-width:760px;width:100%;margin:0 auto}
.msg{padding:11px 15px;border-radius:14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{background:var(--user);align-self:flex-end}
.msg.ai{background:var(--surface);border:1px solid var(--border);align-self:flex-start}
.msg.err{color:#b3261e;align-self:center;font-size:14px}
.hint{color:var(--muted);text-align:center;margin:auto;font-size:15px}
#bar{display:flex;gap:8px;padding:12px 16px;max-width:760px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;max-height:140px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px 13px;font:inherit}
textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
#send{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:0 18px;font-weight:600}
#send:disabled{opacity:.5;cursor:default}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 12px 10px}
.msg pre{background:var(--bg);border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:10px 12px;overflow-x:auto;white-space:pre;font:13px/1.45 ui-monospace,Consolas,monospace;position:relative}
.msg .copy{position:absolute;top:6px;right:6px;font-size:12px;padding:2px 8px}
</style>
</head>
<body>
<header>
  <h1><span>◆</span> Aero Chat</h1>
  <button class="ghost" id="clear" type="button">Percakapan baru</button>
</header>
<main id="log" aria-live="polite"><p class="hint" id="hint">Tanya apa saja. Enter untuk kirim, Shift+Enter untuk baris baru.</p></main>
<div id="bar">
  <textarea id="in" rows="1" placeholder="Tulis pesan…"></textarea>
  <button id="send" type="button">Kirim</button>
</div>
<footer>Memori persisten via Upstash Redis. Tanpa API key di klien.</footer>
<script>
(function(){
  var log=document.getElementById('log'),input=document.getElementById('in'),send=document.getElementById('send'),hint=document.getElementById('hint');
  var busy=false,ctrl=null;

  function getIdentity(){
    var uid=localStorage.getItem('aero_user_id');
    if(!uid){uid='user_'+Math.random().toString(36).slice(2,10);localStorage.setItem('aero_user_id',uid);}
    var sid=localStorage.getItem('aero_session_id');
    if(!sid){sid='sess_'+Date.now().toString(36);localStorage.setItem('aero_session_id',sid);}
    return {userId:uid,sessionId:sid};
  }

  function add(cls,text){
    if(hint){hint.remove();hint=null;}
    var d=document.createElement('div');d.className='msg '+cls;d.textContent=text;
    log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
  }

  function render(el,text){
    el.textContent='';
    var parts=text.split('```');
    parts.forEach(function(p,i){
      if(i%2===0){
        p=p.replace(i>0?/^\n/:/^$/,'').replace(i<parts.length-1?/\n$/:/^$/,'');
        if(p)el.appendChild(document.createTextNode(p));
        return;
      }
      var nl=p.indexOf('\n');
      var code=(nl>=0?p.slice(nl+1):p).replace(/\n$/,'');
      var pre=document.createElement('pre');
      var btn=document.createElement('button');
      btn.type='button';btn.className='ghost copy';btn.textContent='Salin';
      btn.addEventListener('click',function(){
        navigator.clipboard.writeText(code).then(
          function(){btn.textContent='Tersalin';setTimeout(function(){btn.textContent='Salin';},1500);},
          function(){btn.textContent='Gagal';}
        );
      });
      pre.appendChild(btn);
      pre.appendChild(document.createTextNode(code));
      el.appendChild(pre);
    });
  }

  async function submit(){
    var text=input.value.trim();
    if(!text||busy)return;
    input.value='';input.style.height='auto';
    busy=true;send.disabled=true;
    add('user',text);
    var out=add('ai','Berpikir…');

    var ids=getIdentity();
    var controller=new AbortController();
    ctrl=controller;

    try{
      var resp=await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        signal:controller.signal,
        body:JSON.stringify({
          userId:ids.userId,
          sessionId:ids.sessionId,
          message:text
        })
      });

      if(!resp.ok){
        var errText=await resp.text();
        throw {message:'HTTP '+resp.status+' — '+errText.slice(0,200)};
      }

      var data=await resp.json();
      var reply=data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!reply)throw {message:'Balasan kosong dari upstream'};

      render(out,reply);
    }catch(e){
      if(e.name==='AbortError'){out.remove();}
      else{
        out.remove();
        add('err','Gagal: '+((e&&e.message)||'kesalahan tidak diketahui'));
      }
    }
    busy=false;send.disabled=false;input.focus();
  }

  send.addEventListener('click',submit);

  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}
  });

  input.addEventListener('input',function(){
    input.style.height='auto';
    input.style.height=Math.min(input.scrollHeight,140)+'px';
  });

  document.getElementById('clear').addEventListener('click',function(){
    if(ctrl)ctrl.abort();
    busy=false;send.disabled=false;
    localStorage.removeItem('aero_session_id');
    log.innerHTML='';
    hint=document.createElement('p');hint.className='hint';hint.textContent='Percakapan baru dimulai.';
    log.appendChild(hint);
  });
})();
</script>
</body>
</html>
