<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aero Chat</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --sidebar-bg: #f9f9f9;
  --surface: #f4f4f5;
  --surface-hover: #e4e4e7;
  --text: #09090b;
  --text-muted: #71717a;
  --accent: #d97706;
  --border: #e4e4e7;
  --user-bg: #f4f4f5;
  --sidebar-width: 280px;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --sidebar-bg: #121214;
    --surface: #18181b;
    --surface-hover: #27272a;
    --text: #f4f4f5;
    --text-muted: #a1a1aa;
    --accent: #f59e0b;
    --border: #27272a;
    --user-bg: #27272a;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex;
  -webkit-font-smoothing: antialiased;
}

/* --- SCROLLBAR CUSTOM --- */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* --- SIDEBAR --- */
#sidebar {
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100%;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
  z-index: 100;
}
#sidebar.hidden { transform: translateX(-100%); position: absolute; }
.sidebar-header { padding: 20px 16px 12px; }
.sidebar-header h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; }
.btn-new { width: 100%; padding: 12px; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-md); font-weight: 500; cursor: pointer; font-size: 14px; transition: opacity 0.2s ease; }
.btn-new:hover { opacity: 0.8; }
.search-box { padding: 0 16px 12px; }
.search-box input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid transparent; border-radius: var(--radius-md); color: var(--text); font-size: 14px; transition: border-color 0.2s ease; }
.search-box input:focus { outline: none; border-color: var(--border); background: var(--bg); }
#session-list { flex: 1; overflow-y: auto; list-style: none; padding: 0 12px; }
.session-item { padding: 12px 14px; cursor: pointer; border-radius: var(--radius-md); display: flex; flex-direction: column; gap: 4px; margin-bottom: 4px; transition: background 0.2s ease; }
.session-item:hover { background: var(--surface); }
.session-item.active { background: var(--surface); }
.session-item .title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.session-item .date { font-size: 12px; color: var(--text-muted); }

/* --- MAIN CHAT --- */
#main { flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; position: relative; background: var(--bg); }
header { display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--bg); gap: 12px; }
header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px; }
header h1 span { color: var(--accent); font-size: 18px; }
.menu-toggle { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-muted); display: none; padding: 8px; border-radius: var(--radius-md); transition: background 0.2s; }
.menu-toggle:hover { background: var(--surface); }

@media (max-width: 768px) {
  #sidebar { position: fixed; }
  .menu-toggle { display: block; }
  header { padding: 12px 16px; }
}

#log { flex: 1; overflow-y: auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 24px; max-width: 800px; width: 100%; margin: 0 auto; scroll-behavior: smooth; }
@media (max-width: 768px) { #log { padding: 24px 16px; } }

.msg { padding: 16px 20px; border-radius: var(--radius-lg); max-width: 85%; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.6; font-size: 15px; }
.msg.user { background: var(--user-bg); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.ai { background: var(--bg); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.err { color: #ef4444; align-self: center; font-size: 13px; background: var(--surface); padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid #ef444433; }
.hint { color: var(--text-muted); text-align: center; margin: auto; font-size: 15px; }

/* --- INPUT BAR --- */
#bar { display: flex; gap: 12px; padding: 16px 24px 24px; max-width: 800px; width: 100%; margin: 0 auto; background: var(--bg); }
@media (max-width: 768px) { #bar { padding: 12px 16px 16px; } }
.input-wrapper { flex: 1; display: flex; align-items: flex-end; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 8px 8px 16px; transition: border-color 0.2s ease; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
.input-wrapper:focus-within { border-color: var(--text-muted); }
textarea { flex: 1; resize: none; max-height: 200px; background: transparent; color: var(--text); border: none; padding: 8px 0; font: inherit; font-size: 15px; line-height: 1.5; }
textarea:focus { outline: none; }
textarea::placeholder { color: var(--text-muted); }
#attach { font-size: 22px; padding: 0 12px; border-radius: 50%; background: none; border: none; color: var(--text-muted); cursor: pointer; transition: background 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; height: 44px; width: 44px; }
#attach:hover { background: var(--surface); color: var(--text); }
#send { background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-lg); padding: 0 20px; font-weight: 500; cursor: pointer; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; font-size: 14px; height: 40px; }
#send:hover { opacity: 0.9; }
#send:disabled { opacity: 0.3; cursor: default; }

/* --- FILE CARD --- */
.file-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; margin: 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; transition: border-color 0.2s; }
.file-card:hover { border-color: var(--text-muted); }
.file-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.file-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); display: flex; align-items: center; gap: 8px; }
.file-meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; }
.btn-download-icon { background: var(--bg); border: 1px solid var(--border); color: var(--text); height: 36px; width: 36px; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; flex-shrink: 0; }
.btn-download-icon:hover { background: var(--surface-hover); color: var(--accent); }
.btn-download-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.msg strong { font-weight: 600; color: var(--text); }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h2>Percakapan</h2>
    <button class="btn-new" id="new-chat-btn">+ Percakapan Baru</button>
  </div>
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Cari riwayat...">
  </div>
  <ul id="session-list"></ul>
</div>

<div id="main">
  <header>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <h1><span>◆</span> Aero Chat</h1>
  </header>

  <main id="log" aria-live="polite">
    <p class="hint" id="hint">Tanya apa saja. Enter untuk kirim, Shift+Enter untuk baris baru.</p>
  </main>

  <div id="bar">
    <button id="attach" type="button" title="Lampirkan file">+</button>
    <input type="file" id="file" multiple hidden>
    <div class="input-wrapper">
      <textarea id="in" rows="1" placeholder="Tulis pesan…"></textarea>
      <button id="send" type="button">Kirim</button>
    </div>
  </div>
</div>

<script>
(function(){
  var log = document.getElementById('log'),
      input = document.getElementById('in'),
      send = document.getElementById('send'),
      hint = document.getElementById('hint');
  var sidebar = document.getElementById('sidebar'),
      sessionList = document.getElementById('session-list'),
      menuToggle = document.getElementById('menu-toggle'),
      newChatBtn = document.getElementById('new-chat-btn'),
      searchInput = document.getElementById('search-input');

  var busy = false, ctrl = null, pending = [];
  var fileIn = document.getElementById('file');

  function getUserId(){
    var uid = localStorage.getItem('aero_user_id');
    if(!uid){ uid = 'user_' + Math.random().toString(36).slice(2, 10); localStorage.setItem('aero_user_id', uid); }
    return uid;
  }
  function getSessionId(){ return localStorage.getItem('aero_session_id') || null; }
  function setSessionId(sid){ if(sid) localStorage.setItem('aero_session_id', sid); else localStorage.removeItem('aero_session_id'); }
  function newSessionId(){ return 'sess_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8); }

  function add(cls, text){
    if(hint){ hint.remove(); hint = null; }
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.innerHTML = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  }

  function render(el, text){
    el.textContent = '';
    if(!text) return;
    
    // 1. Coba parse jika model mengembalikan format JSON file
    try {
      var jsonMatch = text.match(/```json\s*({[\s\S]*?})\s*```/);
      if (jsonMatch) {
        var fileData = JSON.parse(jsonMatch[1]);
        if (fileData.file && fileData.content) {
          var textBefore = text.substring(0, jsonMatch.index).trim();
          if (textBefore) {
            var span = document.createElement('span');
            span.innerHTML = textBefore.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            el.appendChild(span);
          }
          
          var card = document.createElement('div');
          card.className = 'file-card';
          var info = document.createElement('div');
          info.className = 'file-info';
          info.innerHTML = `<div class="file-name">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
            ${fileData.file}
          </div>
          <div class="file-meta"><span>${fileData.content.length} chars</span></div>`;
          
          var btn = document.createElement('button');
          btn.className = 'btn-download-icon';
          btn.title = 'Unduh File';
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
          
          btn.onclick = function() {
            var blob = new Blob([fileData.content], {type: 'text/plain'});
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = fileData.file;
            a.click();
            URL.revokeObjectURL(url);
          };
          
          card.appendChild(info);
          card.appendChild(btn);
          el.appendChild(card);
          
          var textAfter = text.substring(jsonMatch.index + jsonMatch[0].length).trim();
          if (textAfter) {
            var span2 = document.createElement('span');
            span2.innerHTML = '<br>' + textAfter.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            el.appendChild(span2);
          }
          return;
        }
      }
    } catch(e) { console.warn("Gagal parse JSON file:", e); }

    // 2. Fallback: Deteksi jika AI mengirim blok kode markdown biasa
    var parts = String(text).split('```');
    for(var i = 0; i < parts.length; i++){
      var part = parts[i];
      if(i % 2 === 0){
        if(part) {
          var span = document.createElement('span');
          span.innerHTML = part.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`(.*?)`/g, '<code style="background:var(--surface);padding:2px 4px;border-radius:4px;font-family:monospace;font-size:13px">$1</code>');
          el.appendChild(span);
        }
        continue;
      }
      
      // Deteksi nama file dari baris pertama blok kode (misal: "html index.html")
      var nl = part.indexOf('\n');
      var firstLine = (nl >= 0 ? part.slice(0, nl) : '').trim();
      var code = (nl >= 0 ? part.slice(nl + 1) : part).replace(/\n$/, '');
      
      var fileName = "kode_" + Math.random().toString(36).slice(2,6) + ".txt";
      if (firstLine) {
        if (firstLine.includes('.')) {
          fileName = firstLine.replace(/[\/\*\/]/g, '').trim(); 
        } else {
          var extMap = {'js':'js','javascript':'js','ts':'ts','typescript':'ts','html':'html','css':'css','py':'py','python':'py','c':'c','cpp':'cpp','c++':'cpp','h':'h','cs':'cs','csharp':'cs','java':'java','rs':'rs','rust':'rs','lua':'lua','json':'json','sql':'sql','sh':'sh','bash':'sh'};
          var ext = extMap[firstLine.toLowerCase()];
          if (ext) fileName = "kode." + ext;
        }
      }

      var card = document.createElement('div');
      card.className = 'file-card';
      var info = document.createElement('div');
      info.className = 'file-info';
      info.innerHTML = `<div class="file-name">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
        ${fileName}
      </div>
      <div class="file-meta"><span>${code.length} chars</span></div>`;
      
      var btn = document.createElement('button');
      btn.className = 'btn-download-icon';
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`;
      btn.onclick = function() {
        var blob = new Blob([code], {type: 'text/plain'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      };
      
      card.appendChild(info);
      card.appendChild(btn);
      el.appendChild(card);
    }
  }

  function appendMessage(role, content){
    var box = document.createElement('div');
    box.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    log.appendChild(box);
    render(box, content || '');
    log.scrollTop = log.scrollHeight;
  }

  async function loadSessions(query = ''){
    var uid = getUserId();
    try {
      var url = `/api/sessions?userId=${encodeURIComponent(uid)}`;
      if(query) url += `&q=${encodeURIComponent(query)}`;
      var resp = await fetch(url);
      if(!resp.ok) throw new Error('Gagal load sesi');
      var data = await resp.json();
      
      sessionList.innerHTML = '';
      var currentSid = getSessionId();

      if(data.sessions && data.sessions.length){
        data.sessions.forEach(function(s){
          var li = document.createElement('li');
          li.className = 'session-item' + (s.sessionId === currentSid ? ' active' : '');
          var date = new Date(s.updatedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
          li.innerHTML = `<span class="title">${s.title}</span><span class="date">${date}</span>`;
          
          li.onclick = function(){ 
            loadSession(s.sessionId); 
            if (window.innerWidth <= 768) sidebar.classList.add('hidden');
          };
          sessionList.appendChild(li);
        });
      } else {
        sessionList.innerHTML = '<li style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center">Tidak ada percakapan.</li>';
      }
    } catch(e) { console.error(e); }
  }

  async function loadSession(sid){
    setSessionId(sid);
    log.innerHTML = '<p class="hint">Memuat percakapan...</p>';
    hint = null;
    var uid = getUserId();
    try {
      var resp = await fetch(`/api/history?userId=${encodeURIComponent(uid)}&sessionId=${encodeURIComponent(sid)}`);
      if(!resp.ok) throw new Error('Gagal load chat');
      var data = await resp.json();
      log.innerHTML = '';
      if(data.messages && data.messages.length){
        data.messages.forEach(m => appendMessage(m.role, m.content));
      } else {
        log.innerHTML = '<p class="hint" id="hint">Percakapan kosong. Mulai ketik pesan.</p>';
        hint = document.getElementById('hint');
      }
    } catch(e) {
      log.innerHTML = '<p class="msg err">Gagal memuat pesan.</p>';
    }
    loadSessions(searchInput.value);
    input.focus();
  }

  newChatBtn.onclick = function(){
    setSessionId(newSessionId());
    log.innerHTML = '<p class="hint" id="hint">Percakapan baru dimulai.</p>';
    hint = document.getElementById('hint');
    loadSessions();
    if (window.innerWidth <= 768) sidebar.classList.add('hidden');
    input.focus();
  };

  async function submit(){
    var text = input.value.trim();
    if((!text && !pending.length) || busy) return;
    if(!getSessionId()) setSessionId(newSessionId());

    input.value = ''; input.style.height = 'auto';
    busy = true; send.disabled = true;

    var fullMessage = text;
    var names = [];
    for(var i = 0; i < pending.length; i++){
      names.push(pending[i].name);
      fullMessage += "\n\n[Lampiran: " + pending[i].name + "]\n" + pending[i].text;
    }
    if(!fullMessage.trim()) fullMessage = '(lampiran kosong)';

    appendMessage('user', text + (names.length ? ((text ? '\n' : '') + '📎 ' + names.join(', ')) : ''));
    pending = [];

    var out = document.createElement('div');
    out.className = 'msg ai'; out.textContent = 'Berpikir…';
    log.appendChild(out); log.scrollTop = log.scrollHeight;

    var uid = getUserId();
    var sid = getSessionId();
    var controller = new AbortController(); ctrl = controller;

    try {
      var resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({ userId: uid, sessionId: sid, message: fullMessage })
      });
      if(!resp.ok){
        var errText = await resp.text();
        throw { message: 'HTTP ' + resp.status + ' — ' + errText.slice(0, 200) };
      }
      var data = await resp.json();
      var reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!reply) throw { message: 'Balasan kosong' };
      
      render(out, reply);
      loadSessions(searchInput.value);
    } catch(e) {
      if(e && e.name === 'AbortError'){ out.remove(); }
      else { out.remove(); add('err', 'Gagal: ' + ((e && e.message) || 'kesalahan')); }
    }
    busy = false; send.disabled = false; input.focus();
  }

  document.getElementById('attach').addEventListener('click', () => fileIn.click());
  send.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit(); }
  });
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
  });
  menuToggle.onclick = () => sidebar.classList.toggle('hidden');
  searchInput.addEventListener('input', () => {
    clearTimeout(window._searchTimer);
    window._searchTimer = setTimeout(() => loadSessions(searchInput.value), 300);
  });

  if(window.innerWidth > 768) sidebar.classList.remove('hidden');
  loadSessions();
  if(getSessionId()){
    loadSession(getSessionId());
  } else {
    setSessionId(newSessionId());
  }

  fileIn.addEventListener('change', async function(){
    var files = Array.prototype.slice.call(fileIn.files); fileIn.value = '';
    for(var i = 0; i < files.length; i++){
      var f = files[i];
      if(f.size > 5 * 1024 * 1024){ add('err', f.name + ' terlalu besar (maks 5 MB).'); continue; }
      if(f.name.toLowerCase().endsWith('.zip')){
        add('user', '📦 Membaca arsip: ' + f.name + '...');
        try {
          var zip = await JSZip.loadAsync(f);
          var combinedText = ""; var fileCount = 0;
          for (var filename in zip.files) {
            var entry = zip.files[filename];
            if (entry.dir) continue;
            if (filename.match(/\.(txt|md|csv|json|log|xml|html|css|js|ts|py|c|cpp|h|cs|java|rs|lua|yml|yaml|ini|cfg|sh|bat|asm|s)$/i)) {
              var content = await entry.async('string');
              combinedText += "\n\n[File dalam zip: " + filename + "]\n" + content;
              fileCount++;
              if (combinedText.length > 300000) { combinedText += "\n\n[... Arsip terpotong ...]"; break; }
            }
          }
          if(fileCount > 0){ pending.push({ name: f.name + ' (arsip)', text: combinedText }); add('user', '✅ Berhasil mengekstrak ' + fileCount + ' file.'); }
          else { add('err', 'Tidak ada file teks di dalam ' + f.name); }
        } catch(e) { add('err', 'Gagal membaca zip: ' + e.message); }
      } else {
        try {
          var buffer = await f.arrayBuffer(); var bytes = new Uint8Array(buffer);
          var isBinary = false;
          for(var j = 0; j < Math.min(bytes.length, 100); j++){ if(bytes[j] === 0){ isBinary = true; break; } }
          if(isBinary){
            var strings = []; var currentStr = "";
            for(var k = 0; k < bytes.length; k++){
              var c = bytes[k];
              if(c >= 32 && c <= 126){ currentStr += String.fromCharCode(c); }
              else { if(currentStr.length >= 4) strings.push(currentStr); currentStr = ""; }
            }
            if(currentStr.length >= 4) strings.push(currentStr);
            var extracted = strings.join("\n");
            if(extracted.length > 0){ pending.push({ name: f.name + ' (biner)', text: "[Strings dari file biner " + f.name + "]\n" + extracted }); add('user', '🔍 Mengekstrak strings: ' + f.name); }
            else { add('err', 'Tidak ada teks yang bisa diekstrak.'); }
          } else {
            var textContent = new TextDecoder("utf-8").decode(bytes);
            pending.push({ name: f.name, text: textContent }); add('user', '📎 ' + f.name + ' (siap)');
          }
        } catch(e) { add('err', 'Gagal membaca ' + f.name + ': ' + e.message); }
      }
    }
  });
})();
</script>
</body>
